<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Відділення та лікарі — Госпіталь ветеранів ім. Юрія Липи</title>
<meta name="description" content="33 відділення та служби госпіталю: пошук за назвою, послугою або прізвищем лікаря.">
<link rel="icon" href="https://hospital-veterans.lviv.ua/wp-content/uploads/2024/04/favicon-32x32-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.filters{display:grid;gap:16px;margin-bottom:28px}
.found{color:var(--muted);font-size:16px}
.group+.group{margin-top:48px}
.group h2{font-size:26px;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.group h2 small{font:600 15px var(--body);color:var(--muted)}
.dlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.dlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.dlist{grid-template-columns:1fr}}
.dcard{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .2s,box-shadow .2s}
@media (hover:hover){.dcard:hover{border-color:var(--primary);box-shadow:var(--shadow)}}
.dcard .ph{width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--soft)}
.dcard .ph img{width:100%;height:100%;object-fit:cover}
.dcard h3{font-size:18px;line-height:1.3}
.dcard p{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
.dcard .hit{display:block;margin-top:6px;font-size:14px;color:var(--primary);font-weight:600}
.empty{padding:40px;text-align:center;border-radius:var(--r);background:#fff;border:1px dashed var(--line)}

/* single department */
.dstats{margin-top:-1px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(28px,4vw,56px);align-items:start}
.aside{position:sticky;top:100px;display:grid;gap:16px}
@media (max-width:980px){.layout{grid-template-columns:1fr}.aside{position:static}.aside .contacts{order:-1}}
@media (max-width:980px){.layout{display:flex;flex-direction:column}.layout>.aside{display:contents}}
.block+.block{margin-top:clamp(40px,5vw,64px)}
.block>h2{font-size:clamp(26px,3vw,34px);margin-bottom:20px}
.rel a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
.rel a:first-of-type{border-top:0}
.rel a:hover{color:var(--primary)}
</style>
</head>
<body>
<script src="../assets/site.js"></script>
<main id="main"></main>
<script>
const {esc, icon, data, param, num, blocks, telText, C} = H;
const main = document.getElementById('main');
const GROUP_ORDER = ['Невідкладна допомога', 'Хірургія', 'Реабілітація', 'Терапія та неврологія', 'Діагностика', 'Поліклініка'];
const short = n => n.replace(/^Поліклініка\s*[–-]\s*/, 'Поліклініка: ');
const summary = d => {
  // prefer a sentence that describes the department itself over a list of services
  const ps = d.text.filter(([k, t]) => k === 'p' && t.length > 60);
  const p = ps.find(([, t]) => /^(У |В )?відділенн|^Відділення|Про відділення/i.test(t)) || ps[0];
  return p ? p[1].replace(/^Про відділення\s+/, '').slice(0, 150).replace(/\s\S*$/, '') + '…' : '';
};
const place = d => /dublyany/.test(d.slug) ? 'смт Дубляни' : 'Винники, вул. Івасюка, 31';

data('departments').then(D => param('s') ? one(D, D.find(d => d.slug === param('s'))) : list(D));

function list(D) {
  document.title = 'Відділення та лікарі — Госпіталь ветеранів ім. Юрія Липи';
  main.innerHTML = `
  <section class="phero phero--text"><div class="wrap">
    <p class="crumbs"><a href="../">Головна</a> / Відділення</p>
    <h1>Відділення та лікарі</h1>
    <p class="lead">${D.length} відділень і служб. Шукайте за назвою, послугою або прізвищем лікаря — наприклад «реабілітація після інсульту», «МРТ» чи «Ганусич».</p>
  </div></section>
  <section class="section"><div class="wrap">
    <div class="filters">
      <label class="search"><span class="sr">Пошук</span>${icon('search')}<input id="q" type="search" placeholder="Назва, послуга або прізвище лікаря" autocomplete="off"></label>
      <div class="chips" id="chips" role="group" aria-label="Напрям"></div>
      <p class="found" id="found" aria-live="polite"></p>
    </div>
    <div id="out"></div>
  </div></section>`;
  // search index: name + text + staff, lowercased
  const idx = D.map(d => [d, (d.name + ' ' + d.text.map(t => t[1]).join(' ') + ' ' + d.staff.map(s => s.name + ' ' + s.role).join(' ')).toLowerCase()]);
  const q = document.getElementById('q'), out = document.getElementById('out');
  let g = param('g') || '';
  const chips = document.getElementById('chips');
  const drawChips = () => H.keepFocus(chips, 'data-g', () => chips.innerHTML = [['', 'Усі', D.length], ...GROUP_ORDER.map(x => [x, x, D.filter(d => d.group === x).length])]
    .map(([v, l, n]) => `<button class="chip" type="button" data-g="${esc(v)}" aria-pressed="${v === g}">${esc(l)} <small>${n}</small></button>`).join(''));
  chips.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) { g = b.dataset.g; drawChips(); draw(); } });

  function draw() {
    const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const hits = idx.filter(([d, s]) => (!g || d.group === g) && words.every(w => s.includes(w))).map(([d]) => d);
    document.getElementById('found').textContent = words.length || g ? `Знайдено: ${hits.length}` : '';
    if (!hits.length) { out.innerHTML = `<div class="empty"><h3>Серед відділень нічого не знайдено</h3><p class="muted" style="margin-top:8px">Шукаєте обстеження чи послугу? <a href="../patsiientam/?q=${encodeURIComponent(q.value)}#ciny">Пошукайте в цінах</a> або зателефонуйте в реєстратуру: <a href="tel:${C.clinic.tel}">${telText(C.clinic.tel)}</a></p></div>`; return; }
    const staffHit = d => words.length ? d.staff.find(s => words.every(w => (s.name + ' ' + s.role).toLowerCase().includes(w))) : null;
    const cardHtml = d => {
      const s = staffHit(d);
      return `<a class="dcard" href="?s=${encodeURIComponent(d.slug)}"><div class="ph">${d.photos[0] ? `<img src="${esc(d.photos[0])}" alt="" loading="lazy">` : ''}</div>
        <div><h3>${esc(short(d.name))}</h3><p>${esc(d.staff.length ? `${d.staff.length} ${H.plural(d.staff.length, 'профіль', 'профілі', 'профілів')} фахівців` : place(d))}</p>${s ? `<span class="hit">${esc(s.name)} — ${esc(s.role)}</span>` : ''}</div></a>`;
    };
    // when searching, matches in the department name come first, in their own block
    const byName = words.length ? hits.filter(d => words.every(w => d.name.toLowerCase().includes(w))) : [];
    const rest = hits.filter(d => !byName.includes(d));
    out.innerHTML = (byName.length ? `<div class="group"><h2>Збіг у назві <small>${byName.length}</small></h2><div class="dlist">${byName.map(cardHtml).join('')}</div></div>` : '')
      + GROUP_ORDER.filter(x => rest.some(d => d.group === x)).map(x => {
      const ds = rest.filter(d => d.group === x);
      return `<div class="group"><h2>${esc(byName.length ? 'Згадується у ' + x.toLowerCase() : x)} <small>${ds.length}</small></h2><div class="dlist">${ds.map(cardHtml).join('')}</div></div>`;
    }).join('');
  }
  q.addEventListener('input', draw);
  drawChips(); draw();
}

function one(D, d) {
  if (!d) { main.innerHTML = `<section class="section"><div class="wrap"><h1>Відділення не знайдено</h1><p style="margin-top:16px"><a href="../viddilennia/">Усі відділення</a></p></div></section>`; return; }
  document.title = `${d.name} — Госпіталь ветеранів ім. Юрія Липи`;
  const lead = summary(d);
  const related = D.filter(x => x.group === d.group && x.slug !== d.slug).slice(0, 6);
  const phones = d.phones.map(t => `<a class="phone" href="tel:${t}"><span class="ico">${icon('phone')}</span><span><b>${telText(t)}</b><small>Телефон відділення</small></span></a>`).join('');
  main.innerHTML = `
  <section class="phero"><div class="wrap">
    <div>
      <p class="crumbs"><a href="../">Головна</a> / <a href="../viddilennia/">Відділення</a> / <a href="../viddilennia/?g=${encodeURIComponent(d.group)}">${esc(d.group)}</a></p>
      <h1>${esc(d.name)}</h1>
      ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
      <div class="btns">
        ${d.phones[0] ? `<a class="btn btn-primary" href="tel:${d.phones[0]}">${icon('phone')}${telText(d.phones[0])}</a>` : ''}
        <a class="btn btn-line" href="../patsiientam/#zapys">${icon('cal')}Записатися</a>
      </div>
      <p class="muted" style="margin-top:18px;display:flex;gap:8px;align-items:center">${icon('pin')}${place(d)}</p>
    </div>
    <div class="pic">${d.photos[0] ? `<img src="${esc(d.photos[0])}" alt="${esc(d.name)}">` : ''}</div>
  </div></section>
  ${d.stats.length ? `<section class="section--tight section--white dstats"><div class="wrap"><div class="stats ${d.stats.length === 4 ? 's4' : ''}">${d.stats.map(([v, l]) => `<div><b>${num(v)}</b><span>${esc(l)}</span></div>`).join('')}</div><p class="muted" style="margin-top:10px;font-size:15px">За даними відділення.</p></div></section>` : ''}
  <section class="section"><div class="wrap layout">
    <div>
      ${d.text.length ? `<div class="block"><h2>Про відділення</h2><div class="prose">${blocks(d.text.map(([k, t]) => [k, t.replace(/^Про відділення\s+/, '')]))}</div></div>` : ''}
      ${d.staff.length ? `<div class="block"><h2>Команда відділення</h2><div class="people">${d.staff.map(s => `<div class="person"><div class="ph">${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy">` : ''}</div><h3>${esc(s.name)}</h3><p>${esc(s.role)}</p></div>`).join('')}</div></div>` : ''}
      ${d.photos.length > 1 ? `<div class="block"><h2>Фото відділення</h2><div class="gallery">${d.photos.slice(0, 9).map(p => `<a href="${esc(p)}" target="_blank" rel="noopener" aria-label="Фото відділення — відкрити у повному розмірі"><img src="${esc(p)}" alt="" loading="lazy"></a>`).join('')}</div></div>` : ''}
    </div>
    <aside class="aside">
      <div class="card contacts"><h3 style="margin-bottom:14px">Контакти</h3><div class="phones">${phones || `<p class="muted">Телефон відділення уточнюйте в реєстратурі.</p>`}${H.phone('clinic')}</div></div>
      ${related.length ? `<div class="card rel"><h3 style="margin-bottom:8px">Також у напрямі «${esc(d.group)}»</h3>${related.map(x => `<a href="?s=${encodeURIComponent(x.slug)}">${esc(short(x.name))}${icon('arrow')}</a>`).join('')}</div>` : ''}
    </aside>
  </div></section>`;
  scrollTo(0, 0);
}
</script>
</body>
</html>
