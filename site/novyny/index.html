<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новини — Госпіталь ветеранів ім. Юрія Липи</title>
<meta name="description" content="Новини Львівського обласного госпіталю ветеранів війн та репресованих імені Юрія Липи.">
<link rel="icon" href="https://hospital-veterans.lviv.ua/wp-content/uploads/2024/04/favicon-32x32-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.lead-news{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border-radius:24px;overflow:hidden;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);margin-bottom:28px}
.lead-news .ph{min-height:320px;position:relative;background:var(--soft)}
.lead-news .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lead-news .bd{padding:clamp(24px,3.5vw,44px);display:flex;flex-direction:column;gap:12px;justify-content:center}
.lead-news h2{font-size:clamp(26px,2.8vw,34px)}
.lead-news p{color:var(--muted)}
@media (max-width:860px){.lead-news{grid-template-columns:1fr}.lead-news .ph{min-height:220px}}
.more-wrap{text-align:center;margin-top:36px}
.article{max-width:52rem;margin-inline:auto}
.article h1{font-size:clamp(32px,4vw,48px);line-height:1.1;margin:10px 0 24px}
.article .cover{border-radius:22px;overflow:hidden;margin-bottom:32px;background:var(--soft)}
.article .cover img{width:100%;max-height:560px;object-fit:cover}
.article .prose{max-width:none}
</style>
</head>
<body>
<script src="../assets/site.js"></script>
<main id="main"></main>
<script>
const {esc, icon, data, param, date, blocks} = H;
const main = document.getElementById('main');
const card = n => `<a class="pcard" href="?s=${encodeURIComponent(n.slug)}"><div class="ph">${n.thumb ? `<img src="${esc(n.thumb)}" alt="" loading="lazy">` : ''}</div>
  <div class="bd"><time datetime="${n.date}">${date(n.date)}</time><h3>${esc(n.title)}</h3><p>${esc(n.excerpt.slice(0, 150))}${n.excerpt.length > 150 ? '…' : ''}</p></div></a>`;

data('news').then(N => param('s') ? one(N, N.find(n => n.slug === param('s'))) : list(N));

function list(N) {
  let shown = 13;
  main.innerHTML = `
  <section class="phero phero--text"><div class="wrap">
    <p class="crumbs"><a href="../">Головна</a> / Новини</p>
    <h1>Новини госпіталю</h1>
    <p class="lead">Події, нове обладнання, реабілітація захисників і міжнародна співпраця.</p>
  </div></section>
  <section class="section"><div class="wrap">
    <a class="lead-news" href="?s=${encodeURIComponent(N[0].slug)}"><div class="ph"><img src="${esc(N[0].image || N[0].thumb)}" alt=""></div>
      <div class="bd"><span class="tag">Остання новина</span><time class="meta-s" datetime="${N[0].date}">${date(N[0].date)}</time><h2>${esc(N[0].title)}</h2><p>${esc(N[0].excerpt.slice(0, 220))}…</p><span class="more">Читати ${icon('arrow')}</span></div></a>
    <div class="grid g3" id="grid"></div>
    <div class="more-wrap"><button class="btn btn-line" id="more" type="button">Показати ще</button></div>
  </div></section>`;
  const grid = document.getElementById('grid'), more = document.getElementById('more');
  const draw = () => { grid.innerHTML = N.slice(1, shown).map(card).join(''); more.hidden = shown >= N.length; };
  more.onclick = () => { shown += 12; draw(); };
  draw();
}

function one(N, n) {
  if (!n) { main.innerHTML = `<section class="section"><div class="wrap"><h1>Новину не знайдено</h1><p style="margin-top:16px"><a href="../novyny/">Усі новини</a></p></div></section>`; return; }
  document.title = `${n.title} — Госпіталь ветеранів ім. Юрія Липи`;
  const i = N.indexOf(n);
  const photos = n.photos.filter(p => !p.includes(n.image.replace(/\.\w+$/, '')));
  main.innerHTML = `
  <section class="section section--white"><div class="wrap"><article class="article">
    <p class="crumbs"><a href="../">Головна</a> / <a href="../novyny/">Новини</a></p>
    <time class="meta-s" datetime="${n.date}">${date(n.date)}</time>
    <h1>${esc(n.title)}</h1>
    ${n.image ? `<div class="cover"><img src="${esc(n.image)}" alt=""></div>` : ''}
    <div class="prose">${blocks(n.text)}</div>
    ${photos.length ? `<div class="gallery" style="margin-top:36px">${photos.slice(0, 9).map(p => `<a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="" loading="lazy"></a>`).join('')}</div>` : ''}
  </article></div></section>
  <section class="section"><div class="wrap">
    <div class="head"><h2>Інші новини</h2><a class="more" href="../novyny/">Усі новини ${icon('arrow')}</a></div>
    <div class="grid g3">${N.filter((_, k) => k !== i).slice(Math.max(0, i - 1), Math.max(0, i - 1) + 3).map(card).join('')}</div>
  </div></section>`;
  scrollTo(0, 0);
}
</script>
</body>
</html>
